; WearAware - RTC setter
; Type the date and time in the serial monitor, it is written to the RV-3028-C7.
;
;   pio run -t upload -t monitor
;
; Flash the main firmware again afterwards.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Show what you type and send it only when you press Enter
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    constiko/RTC RV-3028-C7 Arduino Library@^2.1.0