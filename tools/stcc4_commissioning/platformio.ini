; WearAware - STCC4 commissioning
; Sensirion continuous-measurement example on the WearAware I2C1 bus
; (SDA 8 / SCL 9), printing CO2 once per second.
;
;   pio run -t upload -t monitor
;
; Flash the main firmware again afterwards.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    Sensirion I2C STCC4
